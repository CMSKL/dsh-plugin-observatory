name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag; run this workflow from the same tag ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DSH_VERSION: 0.1.0-rc.6
  NPM_VERSION: 11.18.0
  PNPM_VERSION: 11.7.0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate annotated tag and package version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          package_version=$(node -p "require('./package.json').version")
          publish_tag=$(node -p "require('./package.json').publishConfig.tag")
          test "$RELEASE_TAG" = "v$package_version"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          PACKAGE_VERSION="$package_version" PUBLISH_TAG="$publish_tag" node --input-type=module -e "import semver from 'semver'; const version = process.env.PACKAGE_VERSION; const expectedTag = semver.prerelease(version) ? 'next' : 'latest'; if (!semver.valid(version) || process.env.PUBLISH_TAG !== expectedTag) process.exit(1)"
      - run: pnpm run check
      - run: pnpm run test:coverage
      - run: pnpm run publint
      - run: pnpm pack --dry-run
      - run: pnpm run test:e2e

  package:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.metadata.outputs.filename }}
      package_name: ${{ steps.metadata.outputs.package_name }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      publish_tag: ${{ steps.metadata.outputs.publish_tag }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: metadata
        name: Resolve artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          prerelease=$(PACKAGE_VERSION="$version" node --input-type=module -e "import semver from 'semver'; process.stdout.write(String(Boolean(semver.prerelease(process.env.PACKAGE_VERSION))))")
          if [[ "$prerelease" = true ]]; then
            publish_tag=next
          else
            publish_tag=latest
          fi
          filename="${package_name#@}"
          filename="${filename//\//-}-$version.tgz"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish_tag=$publish_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-artifacts
          pnpm pack --pack-destination release-artifacts
          test -f "release-artifacts/${{ steps.metadata.outputs.filename }}"
          cd release-artifacts
          sha256sum "${{ steps.metadata.outputs.filename }}" > "${{ steps.metadata.outputs.filename }}.sha256"
          sha256sum -c "${{ steps.metadata.outputs.filename }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ steps.metadata.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  artifact-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-package-${{ needs.package.outputs.tag }}
          path: release-artifacts
      - run: pnpm run test:e2e
        env:
          PACKAGE_SPEC: ${{ github.workspace }}/release-artifacts/${{ needs.package.outputs.filename }}

  publish:
    needs: [package, artifact-smoke]
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/${{ needs.package.outputs.package_name }}/v/${{ needs.package.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.package.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: release-package-${{ needs.package.outputs.tag }}
          path: release-artifacts
      - name: Verify artifact checksum
        working-directory: release-artifacts
        run: sha256sum -c "${{ needs.package.outputs.filename }}.sha256"
      - name: Create draft release and upload verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          filename="${{ needs.package.outputs.filename }}"
          tag="${{ needs.package.outputs.tag }}"
          version="${{ needs.package.outputs.version }}"
          prerelease="${{ needs.package.outputs.prerelease }}"
          if [[ "$prerelease" = true ]]; then
            release_kind=(--prerelease)
            release_notes=$(cat <<EOF
          Install this release candidate from npm with \`dsh plugin --profile demo add dsh-plugin-observatory@next\`, or download the attached tarball and verify its SHA-256 checksum before adding it to a profile.

          This release includes bounded static compatibility auditing, Loader lifecycle observation, optional invariant-registry integration, and real profile boot verification.

          This release candidate is validated with @deepseek-ai/dsh $DSH_VERSION on Node.js 22.19.0 and 24. Static compatibility findings do not establish arbitrary plugin execution safety.
          EOF
          )
          else
            release_kind=()
            release_notes=$(cat <<EOF
          Install the stable release from npm with \`dsh plugin --profile demo add dsh-plugin-observatory\`, or download the attached tarball and verify its SHA-256 checksum before adding it to a profile.

          Version $version is a stable release of Observatory. It provides bounded static plugin compatibility auditing, Loader lifecycle observation, hardened YAML patch traversal, explicit host-version detection, optional invariant-registry integration, and verified profile activation and removal.

          This stable release is validated with @deepseek-ai/dsh $DSH_VERSION on Node.js 22.19.0 and 24. Static compatibility findings do not establish arbitrary plugin execution safety.
          EOF
          )
          fi
          if ! gh release list --limit 100 --json tagName | jq -e --arg tag "$tag" '.[] | select(.tagName == $tag)' >/dev/null; then
            gh release create "$tag" --draft "${release_kind[@]}" --verify-tag --title "dsh-plugin-observatory v$version" --notes "$release_notes"
          fi
          verify_or_upload() {
            local path="$1"
            local name
            local local_digest
            local remote_digest
            name=$(basename "$path")
            local_digest="sha256:$(sha256sum "$path" | awk '{print $1}')"
            remote_digest=$(gh release view "$tag" --json assets | jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest')
            if [[ -z "$remote_digest" ]]; then
              gh release upload "$tag" "$path"
            elif [[ "$remote_digest" != "$local_digest" ]]; then
              echo "release asset digest mismatch for $name" >&2
              exit 1
            fi
          }
          verify_or_upload "release-artifacts/$filename"
          verify_or_upload "release-artifacts/$filename.sha256"
      - name: Publish exact tarball to npm with OIDC
        shell: bash
        run: |
          set -euo pipefail
          package_name="${{ needs.package.outputs.package_name }}"
          version="${{ needs.package.outputs.version }}"
          prerelease="${{ needs.package.outputs.prerelease }}"
          publish_tag="${{ needs.package.outputs.publish_tag }}"
          tarball="./release-artifacts/${{ needs.package.outputs.filename }}"
          dist_tags_before=$(npm view "$package_name" dist-tags --json 2>/dev/null || echo '{}')
          latest_before=$(jq -r '.latest // empty' <<<"$dist_tags_before")
          next_before=$(jq -r '.next // empty' <<<"$dist_tags_before")
          local_integrity=$(node -e "const fs=require('node:fs');const crypto=require('node:crypto');process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "$tarball")
          remote_integrity=$(npm view "$package_name@$version" dist.integrity --json 2>/dev/null | jq -r 'if type == "string" then . else empty end' || true)
          if [[ -z "$remote_integrity" ]]; then
            npm publish "$tarball" --tag "$publish_tag" --access public --provenance
          elif [[ "$remote_integrity" != "$local_integrity" ]]; then
            echo "npm integrity mismatch for $package_name@$version" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            remote_integrity=$(npm view "$package_name@$version" dist.integrity --json 2>/dev/null | jq -r 'if type == "string" then . else empty end' || true)
            if [[ "$remote_integrity" = "$local_integrity" ]]; then
              break
            fi
            if [[ "$attempt" = 6 ]]; then
              echo "npm registry did not expose the expected integrity" >&2
              exit 1
            fi
            sleep 10
          done
          dist_tags=$(npm view "$package_name" dist-tags --json)
          latest_after=$(jq -r '.latest // empty' <<<"$dist_tags")
          next_after=$(jq -r '.next // empty' <<<"$dist_tags")
          if [[ "$prerelease" = true ]]; then
            test "$next_after" = "$version"
            test "$latest_after" = "$latest_before"
            test "$latest_after" != "$version"
          else
            test "$latest_after" = "$version"
            test "$next_after" = "$next_before"
          fi
      - name: Verify registry installation
        run: pnpm run test:e2e
        env:
          PACKAGE_SPEC: ${{ needs.package.outputs.package_name }}@${{ needs.package.outputs.version }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ needs.package.outputs.prerelease }}" = true ]]; then
            gh release edit "${{ needs.package.outputs.tag }}" --draft=false --prerelease
          else
            gh release edit "${{ needs.package.outputs.tag }}" --draft=false --prerelease=false
          fi
